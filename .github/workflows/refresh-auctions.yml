name: Refresh Auction Pages

on:
  schedule:
    # Every 3 hours — auctions don't change that fast
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Also triggerable manually from GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate auction pages
        # generate-auctions.mjs writes directly to dist/auctions/ and updates
        # dist/sitemap.xml. We do NOT run build.js here because it has
        # hardcoded Windows absolute paths that don't work on Ubuntu.
        run: node generate-auctions.mjs --direct

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/auctions/ dist/sitemap.xml auctions/_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh auction pages $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
            # Keep staging in sync with main after every refresh
            git push origin main:staging
          fi

      - name: Deploy to Cloudflare Pages (main)
        if: success()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 27cafbbee6f8e1db0d9499405d4755c1
          projectName: alex-miller
          directory: dist
          branch: main

      - name: Deploy to Cloudflare Pages (staging)
        if: success()
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 27cafbbee6f8e1db0d9499405d4755c1
          projectName: alex-miller
          directory: dist
          branch: staging
