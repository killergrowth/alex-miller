<div class="col-lg-4 col-md-6 mb-30">
  <div style="background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 16px rgba(13,27,62,0.08); height:100%; display:flex; flex-direction:column;">
    <a href="{{url}}" style="display:block; overflow:hidden; flex-shrink:0;">
      <div style="height:200px; background:linear-gradient(135deg,#0d1b3e,#1a3260); display:flex; align-items:center; justify-content:center;">
        <i class="fas fa-tractor" style="font-size:48px; color:#c9a227;"></i>
      </div>
    </a>
    <div style="padding:20px 22px 24px; flex-grow:1; display:flex; flex-direction:column;">
      <div style="font-size:12px; color:#888; margin-bottom:10px; text-transform:uppercase; letter-spacing:0.5px;">{{month_year}}</div>
      <h4 style="font-size:17px; font-weight:700; color:#0d1b3e; margin:0 0 12px; line-height:1.35;">
        <a href="{{url}}" style="color:#0d1b3e; text-decoration:none;">{{title}}</a>
      </h4>
      {{excerpt_html}}
      <a href="{{url}}" style="color:#c9a227; font-weight:700; font-size:14px; text-decoration:none; margin-top:12px; display:inline-block;">Read More &rarr;</a>
    </div>
  </div>
</div>
